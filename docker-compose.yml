version: '3.8'

services:
  ieweb_frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ieweb_nginx_container
    ports:
      - "8095:80"
    volumes:
      - ./src:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: always
